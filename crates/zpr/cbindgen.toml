language = "C"
header = "// Generated by cbindgen from crates/zpr. Do not edit by hand."
include_guard = "ZPR_H"
autogen_warning = "/* This file is generated by cbindgen from the zpr Rust crate — do not edit directly. */"
tab_width = 4
line_length = 100
documentation = true
documentation_style = "doxy"

[export]
prefix = ""

[fn]
prefix = ""

[parse]
parse_deps = false
